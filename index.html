    <script>
      // Fallback: nếu vẫn vào bằng HTTP (proxy/dev), chuyển HTTPS cùng host:port
      (function () {
        if (typeof location === 'undefined' || location.protocol !== 'http:') return;
        location.replace(
          'https://' + location.host + location.pathname + location.search + location.hash,
        );
      })();
    </script>

    <!-- Favicon chung -->
